# general
set  -g default-terminal       "tmux-256color"
set -ag terminal-overrides     ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB,foot:RGB"
set  -g focus-events           on
set  -g escape-time            0
set  -g history-limit          50000
set  -g base-index             1
set  -g pane-base-index        1
set  -g renumber-windows       on
set  -g mouse                  on
set  -g set-clipboard          on
setw -g aggressive-resize      on
setw -g mode-keys              vi
setw -g monitor-activity       off
set  -g visual-activity        off
set  -g display-time           2000
set  -g display-panes-time     1500
set  -g status-interval        5

# prefix → C-a
unbind C-b
set -g prefix C-a
bind  C-a send-prefix

# keys
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "✿ reloaded"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind -r > swap-window -d -t +1
bind -r < swap-window -d -t -1

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# damin palette — #98ABCC blue / #E890B0 pink on #1e1e1e
set -g pane-border-style          "fg=#98ABCC,bg=default"
set -g pane-active-border-style   "fg=#E890B0,bg=default,bold"
set -g mode-style                 "fg=#1e1e1e,bg=#E890B0,bold"
set -g message-style              "fg=#E890B0,bg=#1e1e1e,bold"
set -g message-command-style      "fg=#98ABCC,bg=#1e1e1e,bold"

set -g status                     on
set -g status-position            bottom
set -g status-justify             left
set -g status-style               "fg=default,bg=#1e1e1e"

# ✿ flips blue→pink while prefix is held (vi-mode-badge analogue).
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[fg=#E890B0]✿,#[fg=#98ABCC]✿} #[fg=default,bold]#S#[default] "

set -g status-right-length 80
set -g status-right "#{?window_zoomed_flag,#[fg=#E890B0]▣ zoom  ,}#{?pane_in_mode,#[fg=#98ABCC]✎ #{pane_mode}  ,}#[fg=#E890B0]❥ #[fg=default]%H:%M "

# Fallbacks — bin/refresh-windows.sh rewrites both with a per-window gradient.
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=#E890B0,bold]✿ #I:#W "
setw -g window-status-separator       ""
setw -g window-status-activity-style "fg=#E890B0,bold"
setw -g window-status-bell-style     "fg=#E890B0,bold"

setw -g clock-mode-colour "#E890B0"
setw -g clock-mode-style  24

# Gradient regen on every event that shifts the index→color mapping.
# Paths are literal — tmux substitution doesn't support ${VAR:-default}.
set-hook -g after-new-window  'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
set-hook -g after-kill-pane   'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
set-hook -g window-linked     'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
set-hook -g window-unlinked   'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
set-hook -g window-renamed    'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
set-hook -g session-created   'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
set-hook -g client-attached   'run -b "$HOME/.config/tmux/bin/refresh-windows.sh"'
run-shell -b "$HOME/.config/tmux/bin/refresh-windows.sh"

# os.conf is generated by install.sh.
if-shell '[ -f "$HOME/.config/tmux/os.conf" ]' \
    'source-file "$HOME/.config/tmux/os.conf"'
