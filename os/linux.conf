# Linux — wl-copy on Wayland, xclip on X11
%if "#{==:#{?WAYLAND_DISPLAY,wayland,x11},wayland}"
    bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"
    bind P run -b "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
%else
    bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -in -selection clipboard"
    bind P run -b "xclip -out -selection clipboard | tmux load-buffer - && tmux paste-buffer"
%endif
