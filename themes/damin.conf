# damin — #98ABCC blue borders · #E890B0 pink highlight, contrast #1e1e1e.
# Pure dingbats: ✿ ❀ florette · ❥ ♡ heart · ✧ ⋆ sparkle · ✎ pencil · ⌬ zoom · · dot
#
# Themes are self-contained and swapped by re-sourcing one file, so every
# themes/*.conf must set this exact option list — anything one theme sets and
# another omits survives as a stale value after a live switch.

set -g @theme_name       "damin"
# bin/refresh-windows.sh interpolates the window-list gradient between these,
# then substitutes the result for @C in the two templates below.
set -g @theme_grad_start "#98ABCC"
set -g @theme_grad_end   "#E890B0"
set -g @theme_win_format         "#[fg=@C,nobold] #I:#W "
set -g @theme_win_current_format "#[fg=@C,bold] ✿ #I:#W ♡ "

# panes
set -g pane-border-style            "fg=#98ABCC,bg=default"
set -g pane-active-border-style     "fg=#E890B0,bg=default,bold"
set -g display-panes-colour         "#98ABCC"
set -g display-panes-active-colour  "#E890B0"

# copy mode
set  -g mode-style                     "fg=#1e1e1e,bg=#E890B0,bold"
setw -g copy-mode-match-style          "fg=#1e1e1e,bg=#98ABCC"
setw -g copy-mode-current-match-style  "fg=#1e1e1e,bg=#E890B0,bold"
setw -g copy-mode-mark-style           "fg=#1e1e1e,bg=#98ABCC"

# messages, popups, menus
set -g message-style          "fg=#E890B0,bg=default,bold"
set -g message-command-style  "fg=#98ABCC,bg=default,bold"
set -g popup-style            "fg=default,bg=default"
set -g popup-border-style     "fg=#E890B0"
set -g popup-border-lines     rounded
set -g menu-style             "fg=default,bg=default"
set -g menu-border-style      "fg=#98ABCC"
set -g menu-selected-style    "fg=#1e1e1e,bg=#E890B0,bold"

# Status bar stays transparent (bg=default). Every style is pinned explicitly —
# stale values from a previous config or theme survive `source-file`.
set  -g status-style                 "fg=default,bg=default"
set  -g status-left-style            "fg=default,bg=default"
set  -g status-right-style           "fg=default,bg=default"
setw -g window-status-style          "fg=default,bg=default"
setw -g window-status-current-style  "fg=default,bg=default"
setw -g window-status-last-style     "fg=default,bg=default"

# ✧ sparkle · ✿ flips blue→pink while prefix held · session · subtle dot
set -g status-left "#[fg=#98ABCC]✧ #{?client_prefix,#[fg=#E890B0]✿,#[fg=#98ABCC]✿}#[fg=default,bold] #S #[fg=#98ABCC]·#[default] "

# zoom · copy-mode · ❥ clock · ⋆ tail
set -g status-right "#{?window_zoomed_flag,#[fg=#E890B0]⌬ zoom #[fg=#98ABCC]·#[default] ,}#{?pane_in_mode,#[fg=#98ABCC]✎ #{pane_mode} ·#[default] ,}#[fg=#E890B0]❥ #[fg=default]%H:%M #[fg=#98ABCC]⋆#[default] "

# Fallbacks — bin/refresh-windows.sh rewrites both from the @theme_win_*
# templates with a per-window gradient.
setw -g window-status-format          " #I:#W "
setw -g window-status-current-format  "#[fg=#E890B0,bold] ✿ #I:#W ♡ "
setw -g window-status-activity-style  "fg=#E890B0,bold"
setw -g window-status-bell-style      "fg=#1e1e1e,bg=#E890B0,bold"

setw -g clock-mode-colour "#E890B0"
