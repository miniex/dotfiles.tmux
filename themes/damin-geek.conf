# damin-geek — the one family member that leaves the palette: phosphor terminal,
# #008F11 dim green · #00FF41 bright green on #0a0a0a. ASCII only, no dingbats:
# :: | > _ [Z] [copy-mode] and a $ that flips to ! while the prefix is held.
# Square brackets around the active window, square borders on popups —
# nothing rounded, nothing decorative.
#
# Themes are self-contained and swapped by re-sourcing one file, so every
# themes/*.conf must set this exact option list — anything one theme sets and
# another omits survives as a stale value after a live switch.

set -g @theme_name       "damin-geek"
# bin/refresh-windows.sh interpolates the window-list gradient between these,
# then substitutes the result for @C in the two templates below.
set -g @theme_grad_start "#008F11"
set -g @theme_grad_end   "#00FF41"
set -g @theme_win_format         "#[fg=@C,nobold]  #I:#W  "
set -g @theme_win_current_format "#[fg=@C,bold] [#I:#W] "

# panes
set -g pane-border-style            "fg=#008F11,bg=default"
set -g pane-active-border-style     "fg=#00FF41,bg=default,bold"
set -g display-panes-colour         "#008F11"
set -g display-panes-active-colour  "#00FF41"

# copy mode
set  -g mode-style                     "fg=#0a0a0a,bg=#00FF41,bold"
setw -g copy-mode-match-style          "fg=#0a0a0a,bg=#008F11"
setw -g copy-mode-current-match-style  "fg=#0a0a0a,bg=#00FF41,bold"
setw -g copy-mode-mark-style           "fg=#0a0a0a,bg=#008F11"

# messages, popups, menus
set -g message-style          "fg=#00FF41,bg=default,bold"
set -g message-command-style  "fg=#008F11,bg=default,bold"
set -g popup-style            "fg=default,bg=default"
set -g popup-border-style     "fg=#00FF41"
set -g popup-border-lines     single
set -g menu-style             "fg=default,bg=default"
set -g menu-border-style      "fg=#008F11"
set -g menu-selected-style    "fg=#0a0a0a,bg=#00FF41,bold"

# Status bar stays transparent (bg=default). Every style is pinned explicitly —
# stale values from a previous config or theme survive `source-file`.
set  -g status-style                 "fg=default,bg=default"
set  -g status-left-style            "fg=default,bg=default"
set  -g status-right-style           "fg=default,bg=default"
setw -g window-status-style          "fg=default,bg=default"
setw -g window-status-current-style  "fg=default,bg=default"
setw -g window-status-last-style     "fg=default,bg=default"

# :: rail · $ prompt flips to ! while prefix held · session · pipe
# Single-quoted so tmux's config parser leaves the literal $ alone.
set -g status-left '#[fg=#008F11]:: #{?client_prefix,#[fg=#00FF41]!,#[fg=#008F11]$}#[fg=default,bold] #S #[fg=#008F11]|#[default] '

# [Z]oom · [copy-mode] · clock · blinking-cursor tail
set -g status-right '#{?window_zoomed_flag,#[fg=#00FF41][Z] #[fg=#008F11]|#[default] ,}#{?pane_in_mode,#[fg=#008F11][#{pane_mode}] |#[default] ,}#[fg=#008F11]> #[fg=default]%H:%M #[fg=#00FF41]_#[default] '

# Fallbacks — bin/refresh-windows.sh rewrites both from the @theme_win_*
# templates with a per-window gradient.
setw -g window-status-format          "  #I:#W  "
setw -g window-status-current-format  "#[fg=#00FF41,bold] [#I:#W] "
setw -g window-status-activity-style  "fg=#00FF41,bold"
setw -g window-status-bell-style      "fg=#0a0a0a,bg=#00FF41,bold"

setw -g clock-mode-colour "#00FF41"
