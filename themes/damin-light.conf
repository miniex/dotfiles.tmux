# damin-light — the damin palette darkened for light terminals:
# #4A6FA5 blue borders · #C25E86 pink highlight, contrast #f4f1f4.
# Backgrounds stay `default`, so the terminal's own light background shows through.
#
# Themes are self-contained and swapped by re-sourcing one file, so every
# themes/*.conf must set this exact option list — anything one theme sets and
# another omits survives as a stale value after a live switch.

set -g @theme_name       "damin-light"
# bin/refresh-windows.sh interpolates the window-list gradient between these,
# then substitutes the result for @C in the two templates below.
set -g @theme_grad_start "#4A6FA5"
set -g @theme_grad_end   "#C25E86"
set -g @theme_win_format         "#[fg=@C,nobold] #I:#W "
set -g @theme_win_current_format "#[fg=@C,bold] ✿ #I:#W ♡ "

# panes
set -g pane-border-style            "fg=#4A6FA5,bg=default"
set -g pane-active-border-style     "fg=#C25E86,bg=default,bold"
set -g display-panes-colour         "#4A6FA5"
set -g display-panes-active-colour  "#C25E86"

# copy mode
set  -g mode-style                     "fg=#f4f1f4,bg=#C25E86,bold"
setw -g copy-mode-match-style          "fg=#f4f1f4,bg=#4A6FA5"
setw -g copy-mode-current-match-style  "fg=#f4f1f4,bg=#C25E86,bold"
setw -g copy-mode-mark-style           "fg=#f4f1f4,bg=#4A6FA5"

# messages, popups, menus
set -g message-style          "fg=#C25E86,bg=default,bold"
set -g message-command-style  "fg=#4A6FA5,bg=default,bold"
set -g popup-style            "fg=default,bg=default"
set -g popup-border-style     "fg=#C25E86"
set -g popup-border-lines     rounded
set -g menu-style             "fg=default,bg=default"
set -g menu-border-style      "fg=#4A6FA5"
set -g menu-selected-style    "fg=#f4f1f4,bg=#C25E86,bold"

# Status bar stays transparent (bg=default). Every style is pinned explicitly —
# stale values from a previous config or theme survive `source-file`.
set  -g status-style                 "fg=default,bg=default"
set  -g status-left-style            "fg=default,bg=default"
set  -g status-right-style           "fg=default,bg=default"
setw -g window-status-style          "fg=default,bg=default"
setw -g window-status-current-style  "fg=default,bg=default"
setw -g window-status-last-style     "fg=default,bg=default"

# ✧ sparkle · ✿ flips blue→pink while prefix held · session · subtle dot
set -g status-left "#[fg=#4A6FA5]✧ #{?client_prefix,#[fg=#C25E86]✿,#[fg=#4A6FA5]✿}#[fg=default,bold] #S #[fg=#4A6FA5]·#[default] "

# zoom · copy-mode · ❥ clock · ⋆ tail
set -g status-right "#{?window_zoomed_flag,#[fg=#C25E86]⌬ zoom #[fg=#4A6FA5]·#[default] ,}#{?pane_in_mode,#[fg=#4A6FA5]✎ #{pane_mode} ·#[default] ,}#[fg=#C25E86]❥ #[fg=default]%H:%M #[fg=#4A6FA5]⋆#[default] "

# Fallbacks — bin/refresh-windows.sh rewrites both from the @theme_win_*
# templates with a per-window gradient.
setw -g window-status-format          " #I:#W "
setw -g window-status-current-format  "#[fg=#C25E86,bold] ✿ #I:#W ♡ "
setw -g window-status-activity-style  "fg=#C25E86,bold"
setw -g window-status-bell-style      "fg=#f4f1f4,bg=#C25E86,bold"

setw -g clock-mode-colour "#C25E86"
