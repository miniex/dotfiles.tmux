# damin-blue — no pink at all, just the damin blue family, six steps of it.
# Every tone below is lifted from btop-theme-damin's blue ramp, so the two
# configs stay in step:
#
#   #6F7E96  dim     inactive borders, separators, menu frame
#   #7A8AAA  low     copy-mode matches, the tail sparkle
#   #8597B8  mid     copy-mode marks, command prompt, mode indicator
#   #98ABCC  damin   active pane border, messages, popup frame, clock
#   #B5C5DE  high    selected fills, zoom flag, activity
#   #D4E0EF  peak    prefix held, bell, bright end of the window gradient
#
# Emphasis is carried by brightness rather than hue, so everything selected
# reads blue.
#
# Themes are self-contained and swapped by re-sourcing one file, so every
# themes/*.conf must set this exact option list — anything one theme sets and
# another omits survives as a stale value after a live switch.

set -g @theme_name       "damin-blue"
# Widest span in the ramp, so a long window list still separates.
set -g @theme_grad_start "#6F7E96"
set -g @theme_grad_end   "#D4E0EF"
set -g @theme_win_format         "#[fg=@C,nobold] #I:#W "
set -g @theme_win_current_format "#[fg=@C,bold] ✿ #I:#W ♡ "

# panes
set -g pane-border-style            "fg=#6F7E96,bg=default"
set -g pane-active-border-style     "fg=#98ABCC,bg=default,bold"
set -g display-panes-colour         "#6F7E96"
set -g display-panes-active-colour  "#B5C5DE"

# copy mode
set  -g mode-style                     "fg=#1e1e1e,bg=#B5C5DE,bold"
setw -g copy-mode-match-style          "fg=#1e1e1e,bg=#7A8AAA"
setw -g copy-mode-current-match-style  "fg=#1e1e1e,bg=#B5C5DE,bold"
setw -g copy-mode-mark-style           "fg=#1e1e1e,bg=#8597B8"

# messages, popups, menus
set -g message-style          "fg=#98ABCC,bg=default,bold"
set -g message-command-style  "fg=#8597B8,bg=default,bold"
set -g popup-style            "fg=default,bg=default"
set -g popup-border-style     "fg=#98ABCC"
set -g popup-border-lines     rounded
set -g menu-style             "fg=default,bg=default"
set -g menu-border-style      "fg=#6F7E96"
set -g menu-selected-style    "fg=#1e1e1e,bg=#B5C5DE,bold"

# Status bar stays transparent (bg=default). Every style is pinned explicitly —
# stale values from a previous config or theme survive `source-file`.
set  -g status-style                 "fg=default,bg=default"
set  -g status-left-style            "fg=default,bg=default"
set  -g status-right-style           "fg=default,bg=default"
setw -g window-status-style          "fg=default,bg=default"
setw -g window-status-current-style  "fg=default,bg=default"
setw -g window-status-last-style     "fg=default,bg=default"

# ✧ sparkle · ✿ jumps dim→peak while prefix held · session · subtle dot
set -g status-left "#[fg=#8597B8]✧ #{?client_prefix,#[fg=#D4E0EF]✿,#[fg=#6F7E96]✿}#[fg=default,bold] #S #[fg=#6F7E96]·#[default] "

# zoom · copy-mode · ❥ clock · ⋆ tail
set -g status-right "#{?window_zoomed_flag,#[fg=#B5C5DE]⌬ zoom #[fg=#6F7E96]·#[default] ,}#{?pane_in_mode,#[fg=#8597B8]✎ #{pane_mode} ·#[default] ,}#[fg=#98ABCC]❥ #[fg=default]%H:%M #[fg=#7A8AAA]⋆#[default] "

# Fallbacks — bin/refresh-windows.sh rewrites both from the @theme_win_*
# templates with a per-window gradient.
setw -g window-status-format          " #I:#W "
setw -g window-status-current-format  "#[fg=#B5C5DE,bold] ✿ #I:#W ♡ "
setw -g window-status-activity-style  "fg=#B5C5DE,bold"
setw -g window-status-bell-style      "fg=#1e1e1e,bg=#D4E0EF,bold"

setw -g clock-mode-colour "#98ABCC"
